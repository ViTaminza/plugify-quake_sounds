"QuakeSounds"
{
	"enabled"		"1"
	"debug"			"0"			// отладочные строки в консоль сервера

	"global"
	{
		"enabled_during_warmup"			"1"
		"play_on_entity"				"player"	// player - звук идёт от игрока (позиционный), world - от мира
		"default_volume"				"0.3"	// громкость новых игроков (0..1), каждый меняет в !qs
		// Кто слышит: all, attacker_team, victim_team, involved, attacker, victim, spectator
		"sound_hearable_by"				"attacker"	// звуки убийств слышит только убивший; у кого в записи свой _filter — по нему
		"headshot_once"					"1"			// headshot — только если серия началась с хедшота, дальше звуки серии
		"ignore_bots"					"0"			// 1 - убийства ботов/ботами не считаются, ботам ничего не шлём
		"ignore_world_damage"			"1"			// смерть от мира (падение и т.п.) не продолжает серию
		"count_self_kills"				"0"
		"count_team_kills"				"0"
		"reset_kills_on_death"			"1"
		"reset_kills_on_round_start"	"1"
	}

	"precache"
	{
		// Аддон 3811020435 "Quake 7 Sounds" не содержит файла soundevents — звуки играются
		// прямыми путями sounds/quake7/*.vsnd. Поэтому soundevent_file пустой.
		// Сами звуки перечислены в addons/configs/precacher.ini (Precacher).
		"soundevent_file"		"soundevents/soundevents_alko.vsndevts"
		"additional_files"
		{
			"f1"	"sounds/quake7/dominating.vsnd"
			"f2"	"sounds/quake7/firstblood.vsnd"
			"f3"	"sounds/quake7/hattrick.vsnd"
			"f4"	"sounds/quake7/headshot.vsnd"
			"f5"	"sounds/quake7/humiliation.vsnd"
			"f6"	"sounds/quake7/impressive.vsnd"
			"f7"	"sounds/quake7/killingspree.vsnd"
			"f8"	"sounds/quake7/multikill.vsnd"
			"f9"	"sounds/quake7/perfect.vsnd"
			"f10"	"sounds/quake7/play.vsnd"
			"f11"	"sounds/quake7/rampage.vsnd"
			"f12"	"sounds/quake7/teamkiller.vsnd"
			"f13"	"sounds/quake7/triplekill.vsnd"
			"f14"	"sounds/quake7/unstoppable.vsnd"
			"f15"	"sounds/timrc4/30sec.vsnd"
			"f16"	"sounds/timrc4/20sec.vsnd"
			"f17"	"sounds/timrc4/10sec.vsnd"
			"f18"	"sounds/timrc4/5sec.vsnd"
			"f19"	"sounds/timrc4/4sec.vsnd"
			"f20"	"sounds/timrc4/3sec.vsnd"
			"f21"	"sounds/timrc4/2sec.vsnd"
			"f22"	"sounds/timrc4/1sec.vsnd"
		}
	}

	"commands"
	{
		"settings"				"!qs"		// чат-команды через запятую: выключить/включить звуки себе
		"settings_menu"			"0"			// 1 - по команде открывать меню, 0 - сразу переключать
		"language"				"!lang"		// !lang ru — язык сообщений игрока, "" - выключить команду
		"utils_settings_menu"	"1"			// пункт «Quake-звуки» в общем меню настроек utils
	}

	"messages"
	{
		"enable_center_message"		"0"
		"center_message_type"		"default"	// default, alert, html
		"enable_chat_message"		"0"
	}

	// Если одно убийство подходит под несколько событий, играет то, у кого число меньше.
	"sound_priorities"
	{
		"special_events"	"1"		// lastmanstanding, selfkill, teamkill, firstblood, knifekill, headshot
		"weapons"			"2"		// weapon_<оружие>
		"kill_streak"		"3"		// серия убийств: "3", "5", ...
	}

	// Ключи: число (серия убийств), weapon_<имя>, firstblood, headshot, knifekill, selfkill, teamkill,
	// lastmanstanding, round_start, round_end, round_freeze_end, bomb_planted, bomb_defused,
	// bomb_exploded, bomb_<секунд до взрыва>.
	// В записи: тексты по языкам ("ru", "en", ...), "_sound" — soundevent или sounds/... (несколько через
	// запятую — случайный), необязательные "_filter" (кто слышит) и "_volume".
	// Имена звуков ниже — из аддона 3811020435 "Quake 7 Sounds" (sounds/quake7/*.vsnd).
	"sounds"
	{
		// серия убийств: по одному звуку на каждое число, слышит убивший (тройное — все)
		"2"
		{
			"ru"		"Двойное убийство"
			"en"		"Double Kill"
			"_sound"	"Alko.Quake7.Doublekill"
		}
		"3"
		{
			"ru"		"Тройное убийство"
			"en"		"Triple Kill"
			"_sound"	"Alko.Quake7.Triplekill"
			"_filter"	"all"		// слышат все
		}
		"4"
		{
			"ru"		"Мульти-килл"
			"en"		"Multi Kill"
			"_sound"	"Alko.Quake7.Multikill"
		}
		"5"
		{
			"ru"		"Ультра-килл"
			"en"		"Ultra Kill"
			"_sound"	"Alko.Quake7.Ultrakill"
		}
		"6"
		{
			"ru"		"Монстр-килл"
			"en"		"Monster Kill"
			"_sound"	"Alko.Quake7.Monsterkill"
		}
		"7"
		{
			"ru"		"Серия убийств"
			"en"		"Killing Spree"
			"_sound"	"Alko.Quake7.Killingspree"
		}
		"8"
		{
			"ru"		"Буйство"
			"en"		"Rampage"
			"_sound"	"Alko.Quake7.Rampage"
		}
		"9"
		{
			"ru"		"Доминирует"
			"en"		"Dominating"
			"_sound"	"Alko.Quake7.Dominating"
		}
		"10"
		{
			"ru"		"Неудержим"
			"en"		"Unstoppable"
			"_sound"	"Alko.Quake7.Unstoppable"
		}
		"11"
		{
			"ru"		"Богоподобен"
			"en"		"Godlike"
			"_sound"	"Alko.Quake7.Godlike"
		}
		"12"
		{
			"ru"		"Безумие"
			"en"		"Wicked Sick"
			"_sound"	"Alko.Quake7.Wickedsick"
		}
		"13"
		{
			"ru"		"Нелепо много"
			"en"		"Ludicrous Kill"
			"_sound"	"Alko.Quake7.Ludicrouskill"
		}
		"14"
		{
			"ru"		"Охренеть"
			"en"		"Holy Shit"
			"_sound"	"Alko.Quake7.Holyshit"
		}
		// lastmanstanding: в аддоне 3811020435 нет отдельного звука «последний в команде»,
		// запись без _sound плагин пропускает. Если звук появится — раскомментировать.
		//"lastmanstanding"
		//{
		//	"ru"		"Последний в команде"
		//	"en"		"Last Man Standing"
		//	"_sound"	"Alko.Quake7.Hattrick"
		//	"_filter"	"victim_team"		// иначе выдаст позицию последнего врагам
		//}
		"firstblood"
		{
			"ru"		"Первая кровь"
			"en"		"First Blood"
			"_sound"	"Alko.Quake7.Firstblood"
		}
		"knifekill"
		{
			"ru"		"Убийство ножом"
			"en"		"Knife Kill"
			"_sound"	"Alko.Quake7.Humiliation"	// в Quake убийство в ближнем бою — HUMILIATION
			"_filter"	"all"		// слышат все
		}
		"teamkill"
		{
			"ru"		"Убил своего"
			"en"		"Team Kill"
			"_sound"	"Alko.Quake7.Teamkiller"
		}
		"selfkill"
		{
			"ru"		"Самоубийство"
			"en"		"Self Kill"
			"_sound"	"Alko.Quake7.Perfect"
		}
		"headshot"
		{
			"ru"		"В голову"
			"en"		"Headshot"
			"_sound"	"Alko.Quake7.Headshot"
		}
		"weapon_hegrenade"
		{
			"ru"		"Убийство гранатой"
			"en"		"Grenade Kill"
			"_sound"	"Alko.Quake7.Perfect"
			"_filter"	"all"		// слышат все
		}
		// round_start: в аддоне нет «Prepare to fight»; сигнал начала боя играет на round_freeze_end.
		"round_freeze_end"
		{
			"_sound"	"Alko.Quake7.Play"
		}
		// отсчёт C4 — файлы timrc4 из аддона 3811020435
		"bomb_30"	{ "_sound"	"Alko.Timer.30sec" }
		"bomb_20"	{ "_sound"	"Alko.Timer.20sec" }
		"bomb_10"	{ "_sound"	"Alko.Timer.10sec" }
		"bomb_5"	{ "_sound"	"Alko.Timer.5sec" }
		"bomb_4"	{ "_sound"	"Alko.Timer.4sec" }
		"bomb_3"	{ "_sound"	"Alko.Timer.3sec" }
		"bomb_2"	{ "_sound"	"Alko.Timer.2sec" }
		"bomb_1"	{ "_sound"	"Alko.Timer.1sec" }
	}
}
